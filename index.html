<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetsPresso 벤치마크 북</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0c10; --surface:#111318; --surface2:#181c24; --border:#1e2330;
    --accent:#00d4ff; --optimized:#1ED2EB; --npu:#a78bfa;
    --text:#e8eaf0; --muted:#5a6070; --sidebar-w:250px;
    --orig-color:#9B9DA4; --gpu-color:#1ED2EB; --npu-color:#a78bfa;
    --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Nanum Gothic',system-ui,sans-serif;
    --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'D2Coding','Nanum Gothic Coding',monospace;
    --green:#34d399; --orange:#fb923c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font); background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; font-size:16px; }

  /* Header */
  header { display:flex; align-items:center; padding:0 28px; height:60px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; gap:14px; }
  header h1 { font-family:var(--font); font-size:20px; font-weight:700; color:#ffffff; letter-spacing:0.01em; white-space:nowrap; }
  header h1 span { color:var(--accent); }
  .header-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .header-badge { font-size:12px; font-family:var(--mono); color:var(--muted); border:1px solid var(--border); padding:4px 10px; border-radius:20px; }
  .header-tagline { font-size:13px; color:var(--muted); }

  /* Layout */
  .layout { display:flex; flex:1; overflow:hidden; }

  /* Sidebar */
  aside { width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto; }
  aside::-webkit-scrollbar { width:4px; }
  aside::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  .sidebar-section { border-bottom:1px solid var(--border); padding-bottom:6px; }
  .sidebar-label { width:calc(100% - 16px); margin:3px 8px 0; padding:10px 12px;
    background:#212836; border:1px solid #303950; border-radius:9px;
    font-family:var(--font); font-size:13.5px; font-weight:700; color:#f0f2f7; letter-spacing:0; text-transform:none;
    cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left; user-select:none;
    transition:background .16s, border-color .16s, color .16s; }
  .sidebar-label:hover { background:#2b3446; border-color:#465274; color:#ffffff; }
  .sidebar-label:hover .chev { color:#ffffff; }
  .sidebar-label .sl-txt { flex:1; line-height:1.3; }
  .sidebar-label .cnt { font-family:var(--mono); font-size:11px; color:#c8cad0; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.10); padding:2px 8px; border-radius:20px; flex-shrink:0; }
  .sidebar-label .chev { font-size:11px; color:#a8b0c0; transition:transform .22s ease, color .16s; flex-shrink:0; }
  .sidebar-section.collapsed .chev { transform:rotate(-90deg); }
  .sidebar-section.collapsed .model-list { display:none; }
  .sidebar-section:not(.collapsed) > .sidebar-label { background:rgba(0,212,255,0.16); border-color:rgba(0,212,255,0.45); color:#b6f2ff; }
  .sidebar-section:not(.collapsed) > .sidebar-label .chev { color:#1ED2EB; }
  .sidebar-section:not(.collapsed) > .sidebar-label .cnt { color:#b6f2ff; background:rgba(0,212,255,0.14); border-color:rgba(0,212,255,0.35); }
  .sidebar-section:not(.collapsed) > .sidebar-label:hover { background:rgba(0,212,255,0.16); color:#ffffff; }
  .sidebar-section { border-bottom:none; padding-bottom:2px; }
  .sidebar-section:not(.collapsed) { padding-bottom:8px; }
  .model-list { padding:4px 10px 0 16px; }
  .model-btn { border-left:1px solid var(--border); border-radius:0 8px 8px 0; padding-left:12px; }
  .model-btn:hover { border-left-color:#333c4d; }
  .model-btn.active { border-left:2px solid var(--accent); }
  .model-list { padding:4px 8px; display:flex; flex-direction:column; gap:3px; }
  .model-btn { background:transparent; border:1px solid transparent; border-radius:8px; padding:8px 11px; cursor:pointer; color:#9ba3b5; font-family:var(--font); font-size:13.5px; font-weight:500; text-align:left; transition:all 0.2s; display:flex; align-items:center; gap:8px; line-height:1.35; }
  .model-btn:hover { background:var(--surface2); color:var(--text); border-color:var(--border); }
  .model-btn.active { background:rgba(0,212,255,0.08); color:var(--accent); border-color:rgba(0,212,255,0.25); }
  .model-btn .dot { width:6px; height:6px; border-radius:50%; background:#9ba3b5; flex-shrink:0; transition:background 0.2s; }
  .model-btn.active .dot { background:var(--accent); box-shadow:0 0 6px var(--accent); }
  .model-btn .btn-txt { flex:1; }
  .model-btn .btn-sub { display:block; font-size:11px; color:#6b7280; font-weight:400; margin-top:1px; }
  .model-btn.active .btn-sub { color:#7fb8c8; }
  .overview-btn { margin:10px 8px 4px; background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.2); border-radius:8px; padding:10px 12px; cursor:pointer; color:#c8d4e8; font-family:var(--font); font-size:14px; font-weight:600; text-align:left; transition:all 0.2s; display:flex; align-items:center; gap:8px; }
  .overview-btn:hover { background:rgba(0,212,255,0.12); color:#fff; }
  .overview-btn.active { background:rgba(0,212,255,0.14); color:var(--accent); }

  /* Main */
  main { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
  main > * { flex-shrink:0; }
  main::-webkit-scrollbar { width:4px; }
  main::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  /* Empty */
  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--muted); text-align:center; }
  .empty-icon { width:60px; height:60px; border:2px dashed var(--border); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; opacity:0.5; }

  /* Animations */
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  .anim-0 { opacity:0; transform:translateY(8px);  animation:fadeUp 0.4s ease 0.00s forwards; }
  .anim-1 { opacity:0; transform:translateY(12px); animation:fadeUp 0.4s ease 0.08s forwards; }
  .anim-2 { opacity:0; transform:translateY(12px); animation:fadeUp 0.4s ease 0.16s forwards; }
  .anim-3 { opacity:0; transform:translateY(12px); animation:fadeUp 0.4s ease 0.24s forwards; }

  /* ======= MODEL HEADER ======= */
  .model-header-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px; }
  .model-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
  .model-title-left h2 { font-size:24px; font-weight:800; color:#ffffff; letter-spacing:-0.02em; margin-bottom:6px; }
  .model-task-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; background:rgba(0,212,255,0.07); border:1px solid rgba(0,212,255,0.2); font-size:13px; color:#c8d0e0; }
  .hw-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .hw-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); font-size:13px; color:#c8cad0; }
  .hw-chip .hw-icon { font-size:14px; }
  .hw-chip .hw-type { font-size:11px; font-family:var(--mono); padding:2px 6px; border-radius:4px; margin-left:4px; }
  .hw-gpu  { background:rgba(30,210,235,0.08);  border-color:rgba(30,210,235,0.2);  color:#1ED2EB; }
  .hw-npu  { background:rgba(167,139,250,0.08); border-color:rgba(167,139,250,0.2); color:#a78bfa; }
  .hw-cpu  { background:rgba(251,146,60,0.08);  border-color:rgba(251,146,60,0.2);  color:#fb923c; }
  .hw-dsp  { background:rgba(52,211,153,0.08);  border-color:rgba(52,211,153,0.2);  color:#34d399; }
  .hw-mcu  { background:rgba(236,72,153,0.08);  border-color:rgba(236,72,153,0.2);  color:#ec4899; }

  /* ======= BEFORE/AFTER SUMMARY BAR ======= */
  .before-after-banner { border-radius:14px; overflow:hidden; border:1px solid var(--border); }
  .ba-header { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; background:var(--surface2); border-bottom:1px solid var(--border); font-size:12px; font-family:var(--mono); color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .ba-cards { display:flex; gap:0; }
  .ba-card { flex:1; padding:14px 18px; background:var(--surface); position:relative; }
  .ba-card + .ba-card { border-left:1px solid var(--border); }
  .ba-card.before-card { border-left:3px solid rgba(155,157,164,0.4); }
  .ba-card.after-card-gpu { border-left:3px solid rgba(30,210,235,0.5); }
  .ba-card.after-card-npu { border-left:3px solid rgba(167,139,250,0.5); }
  .ba-label { font-size:11px; font-family:var(--mono); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; }
  .ba-label.orig-lbl { color:var(--orig-color); }
  .ba-label.gpu-lbl  { color:var(--gpu-color); }
  .ba-label.npu-lbl  { color:var(--npu-color); }
  .ba-hw { font-size:13px; color:#c8cad0; margin-bottom:4px; font-weight:600; }
  .ba-time { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--text); }
  .ba-time.na { font-size:14px; color:var(--muted); font-weight:400; font-family:var(--font); }
  .ba-speedup-pill { position:absolute; top:12px; right:14px; display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:13px; font-family:var(--mono); font-weight:700; }
  .pill-gpu { background:rgba(30,210,235,0.12); color:#1ED2EB; border:1px solid rgba(30,210,235,0.3); }
  .pill-npu { background:rgba(167,139,250,0.12); color:#a78bfa; border:1px solid rgba(167,139,250,0.3); }
  .ba-speedup-arrow { font-size:16px; display:flex; align-items:center; padding:0 8px; color:var(--muted); }

  /* ======= CHART SECTION ======= */
  .chart-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 20px; }
  .chart-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .chart-title { font-size:14px; font-family:var(--mono); color:#c8cad0; letter-spacing:0.06em; text-transform:uppercase; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:13px; color:#9ba3b5; }
  .legend-dot { width:10px; height:10px; border-radius:3px; }

  .chart-wrapper { display:flex; height:240px; }
  .y-axis { width:60px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; padding-bottom:40px; padding-right:10px; }
  .y-label { font-size:12px; font-family:var(--mono); color:var(--muted); }
  .chart-area { flex:1; display:flex; flex-direction:column; }
  .grid-and-bars { flex:1; position:relative; border-left:1px solid var(--border); }
  .grid-line { position:absolute; left:0; right:0; border-top:1px solid rgba(255,255,255,0.04); }
  .bars-container { position:absolute; inset:0; display:flex; align-items:flex-end; padding:10px 20px 0; justify-content:space-around; gap:8px; }
  .bar-group { display:flex; flex-direction:column; align-items:center; flex:1; max-width:90px; height:100%; justify-content:flex-end; }
  .bar-wrapper { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; position:relative; }
  .bar-value { font-size:12px; font-family:var(--mono); color:var(--text); margin-bottom:5px; opacity:0; transition:opacity 0.3s ease 0.5s; white-space:nowrap; }
  .bar { width:68%; border-radius:6px 6px 0 0; height:0; transition:height 0.8s cubic-bezier(0.34,1.56,0.64,1); position:relative; cursor:pointer; }
  .bar.original      { background:linear-gradient(180deg,#9B9DA4,#6b6e76); box-shadow:0 0 12px rgba(155,157,164,0.15); }
  .bar.optimized     { background:linear-gradient(180deg,#1ED2EB,#12a0b5); box-shadow:0 0 12px rgba(30,210,235,0.25); }
  .bar.optimized_npu { background:linear-gradient(180deg,#a78bfa,#7c3aed); box-shadow:0 0 12px rgba(167,139,250,0.25); }
  .bar.na            { background:repeating-linear-gradient(45deg,#1e2330,#1e2330 4px,#252a36 4px,#252a36 8px); opacity:0.5; }
  .bar:hover { filter:brightness(1.2); }
  .bar-tooltip { position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity 0.2s; z-index:10; color:var(--text); }
  .bar:hover .bar-tooltip { opacity:1; }
  .x-axis { height:50px; display:flex; align-items:flex-start; padding-top:8px; justify-content:space-around; padding-left:20px; padding-right:20px; gap:8px; }
  .x-label { flex:1; max-width:90px; text-align:center; font-size:13px; color:#fff; line-height:1.5; font-weight:500; }

  /* ======= SPEEDUP CARDS ======= */
  .speedup-section { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .speedup-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; position:relative; overflow:hidden; }
  .speedup-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .speedup-card.s-gpu::before { background:linear-gradient(90deg,#1ED2EB,transparent); }
  .speedup-card.s-npu::before { background:linear-gradient(90deg,#a78bfa,transparent); }
  .speedup-device { font-size:13px; color:#8a90a0; }
  .speedup-value { font-family:var(--mono); font-size:32px; font-weight:700; background:linear-gradient(135deg,var(--optimized),#00a8c5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; margin:4px 0; }
  .speedup-value.npu { background:linear-gradient(135deg,#a78bfa,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .speedup-label { font-size:13px; color:#8a90a0; }
  .speedup-enabled { font-size:13px; color:#c8cad0; line-height:1.6; padding:6px 0; }

  /* ======= ACCURACY ======= */
  .metrics-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; }
  .metrics-title { font-size:13px; font-family:var(--mono); color:#c8cad0; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px; }
  .metrics-row { display:flex; align-items:stretch; gap:12px; flex-wrap:wrap; }
  .metric-card { flex:1; min-width:120px; border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; position:relative; }
  .metric-card.orig-card    { background:rgba(155,157,164,0.07); border:1px solid rgba(155,157,164,0.2); }
  .metric-card.opt-card     { background:rgba(30,210,235,0.06);  border:1px solid rgba(30,210,235,0.2); }
  .metric-card.opt-npu-card { background:rgba(167,139,250,0.06); border:1px solid rgba(167,139,250,0.2); }
  .metric-type  { font-size:11px; font-family:var(--mono); letter-spacing:0.08em; text-transform:uppercase; }
  .orig-card .metric-type    { color:#9B9DA4; }
  .opt-card .metric-type     { color:#1ED2EB; }
  .opt-npu-card .metric-type { color:#a78bfa; }
  .metric-value { font-family:var(--mono); font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.02em; }
  .metric-label { font-size:13px; color:#8a90a0; }
  .metric-diff  { position:absolute; top:12px; right:14px; font-size:12px; font-family:var(--mono); padding:3px 8px; border-radius:20px; background:rgba(30,210,235,0.1); color:#1ED2EB; border:1px solid rgba(30,210,235,0.2); }
  .metric-diff.npu { background:rgba(167,139,250,0.1); color:#a78bfa; border-color:rgba(167,139,250,0.2); }
  .metrics-divider { width:1px; background:var(--border); flex-shrink:0; align-self:stretch; }

  /* ======= LLM STYLES ======= */
  .llm-content-wrap { display:flex; flex-direction:column; gap:14px; }
  .llm-chart-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
  .llm-chart-title { font-size:14px; font-family:var(--mono); color:#c8cad0; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:4px; }
  .llm-chart-unit  { font-size:13px; color:#8a90a0; margin-bottom:20px; }
  .llm-bar-list { display:flex; flex-direction:column; gap:12px; }
  .llm-bar-row  { display:flex; flex-direction:column; gap:5px; }
  .llm-bar-header { display:flex; justify-content:space-between; align-items:baseline; }
  .llm-bar-label { font-size:14px; color:var(--text); font-weight:600; font-family:var(--font); }
  .llm-bar-val   { font-size:14px; font-family:var(--mono); color:var(--text); }
  .llm-track { height:10px; background:var(--surface2); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
  .llm-fill  { height:100%; border-radius:6px; width:0; transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1); }
  .llm-hw-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:6px; font-size:11px; font-family:var(--mono); margin-left:8px; vertical-align:middle; }

  /* LLM context info row */
  .llm-info-row { display:flex; gap:10px; flex-wrap:wrap; }
  .llm-info-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); font-size:13px; color:#c8cad0; }
  .llm-info-chip strong { color:#fff; font-family:var(--mono); }

  /* ======= LLM DEVICE CARDS ======= */
  .llm-framing-box { background:rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.15); border-radius:12px; padding:12px 16px; font-size:13px; color:#a0a8b8; line-height:1.6; }
  .llm-framing-box strong { color:#c8d4e8; }

  .device-cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .device-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; transition:border-color 0.2s; }
  .device-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .device-card.dc-blue::before   { background:linear-gradient(90deg,#1ED2EB,transparent); }
  .device-card.dc-purple::before { background:linear-gradient(90deg,#a78bfa,transparent); }
  .device-card.dc-green::before  { background:linear-gradient(90deg,#34d399,transparent); }
  .device-card.dc-orange::before { background:linear-gradient(90deg,#fb923c,transparent); }
  .dc-hw-name { font-size:15px; font-weight:700; color:#fff; }
  .dc-realtime-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-family:var(--mono); font-weight:700; margin-top:2px; width:fit-content; }
  .badge-realtime  { background:rgba(52,211,153,0.12); color:#34d399; border:1px solid rgba(52,211,153,0.3); }
  .badge-neartime  { background:rgba(251,146,60,0.12);  color:#fb923c; border:1px solid rgba(251,146,60,0.3); }
  .badge-offline   { background:rgba(155,157,164,0.12); color:#9B9DA4; border:1px solid rgba(155,157,164,0.3); }
  .dc-spec { font-size:10.5px; font-family:var(--mono); color:#6b7280; margin:3px 0 4px; }
  .dc-note { font-size:11.5px; color:#8a90a0; background:var(--surface2); border:1px solid var(--border); border-radius:7px; padding:5px 9px; line-height:1.45; }
  .dc-boost { font-size:11.5px; color:#34d399; background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.25); border-radius:7px; padding:5px 9px; line-height:1.45; }
  .dc-boost b { font-family:var(--mono); font-size:13px; }
  .fail-note { background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.22); border-radius:12px; padding:13px 18px; font-size:13.5px; color:#c8d4e8; line-height:1.6; }
  .fail-note b { color:#1ED2EB; }
  .dc-metrics { display:flex; flex-direction:column; gap:2px; }
  .dc-metric-row { display:flex; flex-direction:column; gap:4px; padding-bottom:15px; }
  .dc-metric-header { display:flex; justify-content:space-between; align-items:baseline; }
  .dc-metric-label { font-size:11px; font-family:var(--mono); color:var(--muted); letter-spacing:0.08em; }
  .dc-metric-val { font-size:15px; font-family:var(--mono); font-weight:700; color:var(--text); }
  .dc-track { height:6px; background:var(--surface2); border-radius:4px; overflow:visible; border:1px solid var(--border); position:relative; }
  .dc-fill  { height:100%; border-radius:4px; width:0; transition:width 0.8s cubic-bezier(0.34,1.56,0.64,1); }
  .dc-baseline-line { position:absolute; top:-3px; bottom:-3px; width:2px; border-radius:2px; z-index:2; }
  .dc-baseline-label { position:absolute; top:10px; font-size:9.5px; font-family:var(--mono); white-space:nowrap; transform:translateX(-50%); opacity:0.85; }

  /* LLM bar chart with baseline */
  .llm-chart-subtitle { font-size:13px; color:#8a90a0; margin-bottom:6px; }
  .llm-baseline-note { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#8a90a0; margin-bottom:16px; padding:4px 10px; background:var(--surface2); border-radius:6px; border:1px solid var(--border); }
  .baseline-dot-ttft  { width:8px; height:8px; border-radius:2px; background:#f59e0b; flex-shrink:0; }
  .baseline-dot-dec   { width:8px; height:8px; border-radius:2px; background:#10b981; flex-shrink:0; }
  .llm-track { overflow:visible; position:relative; }
  .llm-baseline-marker { position:absolute; top:-4px; bottom:-4px; width:2px; border-radius:2px; z-index:2; pointer-events:none; }
  .llm-baseline-tip { position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:10px; font-family:var(--mono); white-space:nowrap; padding:2px 5px; border-radius:4px; }
  .llm-bar-val { display:flex; align-items:center; gap:6px; }

  /* ======= BENCH (BEFORE/AFTER) RENDERER ======= */
  .tech-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tech-row-label { font-size:11px; font-family:var(--mono); color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-right:2px; }
  .tech-chip { display:inline-flex; align-items:center; padding:5px 12px; border-radius:8px; background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.18); font-size:12.5px; color:#a8d8e8; }

  .bench-grid { display:flex; flex-direction:column; gap:12px; }
  .bench-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 20px; position:relative; overflow:hidden; }
  .bench-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,#1ED2EB,transparent); }
  .bench-card.keep::before { background:linear-gradient(90deg,#34d399,transparent); }
  .bench-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .bench-metric-name { font-size:15px; font-weight:700; color:#fff; }
  .bench-metric-unit { font-size:12px; font-family:var(--mono); color:var(--muted); margin-left:8px; }
  .bench-delta { display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:20px; font-size:14px; font-family:var(--mono); font-weight:700; background:rgba(30,210,235,0.12); color:#1ED2EB; border:1px solid rgba(30,210,235,0.3); }
  .bench-delta.keep { background:rgba(52,211,153,0.12); color:#34d399; border-color:rgba(52,211,153,0.3); }
  .bench-rows { display:flex; flex-direction:column; gap:11px; }
  .bench-row { display:grid; grid-template-columns:178px 1fr 112px; align-items:center; gap:14px; }
  .bench-row-lbl { font-size:13px; color:#9ba3b5; text-align:right; line-height:1.35; }
  .bench-row.after .bench-row-lbl { color:#c8d4e8; font-weight:600; }
  .bench-track { height:26px; background:var(--surface2); border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .bench-fill { height:100%; border-radius:6px; width:0; transition:width 0.85s cubic-bezier(0.34,1.56,0.64,1); }
  .bench-fill.orig { background:linear-gradient(90deg,#9B9DA4,#6b6e76); }
  .bench-fill.opt  { background:linear-gradient(90deg,#1ED2EB,#12a0b5); box-shadow:0 0 14px rgba(30,210,235,0.28); }
  .bench-fill.opt.keep { background:linear-gradient(90deg,#34d399,#059669); box-shadow:0 0 14px rgba(52,211,153,0.28); }
  .bench-row-val { font-family:var(--mono); font-size:17px; font-weight:700; color:var(--text); }
  .bench-row.before .bench-row-val { color:#9B9DA4; }
  .bench-note { margin-top:12px; font-size:12.5px; color:#8a90a0; line-height:1.6; border-top:1px solid var(--border); padding-top:10px; }
  .bench-note strong { color:#c8d4e8; }

  .bench-summary { background:linear-gradient(90deg,rgba(0,212,255,0.09),rgba(0,212,255,0.02)); border:1px solid rgba(0,212,255,0.2); border-radius:14px; padding:14px 20px; font-size:14.5px; color:#dfe8f5; line-height:1.6; font-weight:600; }
  .bench-footnote { font-size:12.5px; color:#8a90a0; line-height:1.6; padding:0 4px; }

  .spec-box { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:13px; color:#a8b0c0; line-height:1.6; }
  .spec-box strong { color:#fff; }

  /* KIMI chart */
  .svg-chart-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
  .svg-legend { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px; }
  .svg-legend-item { display:flex; align-items:center; gap:7px; font-size:13px; color:#c8cad0; }
  .svg-legend-line { width:20px; height:3px; border-radius:2px; }

  /* ======= KIMI K3 — DRAMATIC ======= */
  .kimi-hero { position:relative; overflow:hidden; border-radius:20px; padding:32px 36px 28px;
    background:radial-gradient(120% 170% at 12% 0%, rgba(30,210,235,0.17), transparent 56%),
               radial-gradient(110% 150% at 96% 105%, rgba(167,139,250,0.15), transparent 55%), #0d1017;
    border:1px solid rgba(30,210,235,0.22); }
  .kimi-hero::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,0.045) 48%,transparent 64%);
    transform:translateX(-100%); animation:shine 3.6s ease 0.9s infinite; }
  @keyframes shine { 0%{transform:translateX(-100%)} 60%,100%{transform:translateX(100%)} }
  .kh-eyebrow { font-family:var(--mono); font-size:11.5px; letter-spacing:0.2em; color:#1ED2EB; text-transform:uppercase; margin-bottom:16px; }
  .kh-line { display:flex; align-items:baseline; flex-wrap:wrap; }
  .kh-num { font-family:var(--mono); font-size:62px; font-weight:700; line-height:1; color:#5f6674; letter-spacing:-0.03em; }
  .kh-num.accent { background:linear-gradient(135deg,#7ff0ff,#1ED2EB 52%,#7c9fff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 24px rgba(30,210,235,0.45)); }
  .kh-unit { font-family:var(--mono); font-size:28px; font-weight:700; color:#5f6674; margin:0 4px 0 2px; }
  .kh-unit.accent { color:#1ED2EB; }
  .kh-arrow { font-size:32px; color:#3f4756; margin:0 16px; }
  .kh-strike { position:relative; }
  .kh-strike::after { content:''; position:absolute; left:-4px; right:2px; top:52%; height:3px; background:#6b7280; border-radius:2px; transform:scaleX(0); transform-origin:left; animation:strike 0.55s cubic-bezier(0.22,1,0.36,1) 1.15s forwards; }
  @keyframes strike { to { transform:scaleX(1); } }
  .kh-sub { margin-top:16px; font-size:17.5px; color:#c8d4e8; line-height:1.6; font-weight:500; }
  .kh-sub b { color:#fff; }
  .kh-sub .hl { color:#1ED2EB; font-weight:700; }
  .kh-pills { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; position:relative; z-index:2; }
  .kh-pill { background:rgba(8,10,14,0.6); border:1px solid var(--border); border-radius:12px; padding:11px 17px; min-width:158px; }
  .kh-pill-v { font-family:var(--mono); font-size:23px; font-weight:700; color:#fff; line-height:1.1; }
  .kh-pill-v.cy { color:#1ED2EB; } .kh-pill-v.gr { color:#34d399; } .kh-pill-v.go { color:#f0b429; }
  .kh-pill-l { font-size:12px; color:#8a90a0; margin-top:4px; }

  /* head-to-head */
  .h2h { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px 14px; }
  .h2h-row { display:grid; grid-template-columns:196px 1fr 168px; align-items:center; gap:14px; margin-bottom:14px; }
  .h2h-name { text-align:right; font-size:12.5px; color:#7a8296; line-height:1.35; }
  .h2h-name b { display:block; color:#c8d4e8; font-size:14px; font-weight:700; margin-bottom:1px; }
  .h2h-row.win .h2h-name b { color:#fff; }
  .h2h-track { position:relative; height:34px; background:var(--surface2); border:1px solid var(--border); border-radius:9px; }
  .h2h-fill { height:100%; border-radius:8px; width:0; transition:width 1.05s cubic-bezier(0.22,1,0.36,1); }
  .h2h-fill.reap { background:linear-gradient(90deg,#454b57,#6b7280); }
  .h2h-fill.orig { background:linear-gradient(90deg,#8a6a1c,#f0b429); }
  .h2h-fill.nota { background:linear-gradient(90deg,#0e7f92,#1ED2EB 70%,#7ff0ff); box-shadow:0 0 22px rgba(30,210,235,0.45); }
  .h2h-base { position:absolute; top:-9px; bottom:-9px; width:2px; background:#f0b429; z-index:4; border-radius:2px; }
  .h2h-base-tip { position:absolute; top:-26px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:10.5px; font-family:var(--mono); color:#f0b429; background:rgba(240,180,41,0.12); border:1px solid rgba(240,180,41,0.3); padding:2px 7px; border-radius:5px; }
  .h2h-val { font-family:var(--mono); font-size:21px; font-weight:700; color:#c8cad0; display:flex; align-items:center; gap:6px; }
  .h2h-row.win .h2h-val { color:#1ED2EB; }
  .h2h-tag { display:inline-block; white-space:nowrap; font-size:10.5px; font-family:var(--mono); padding:3px 8px; border-radius:10px; }
  .tag-win  { background:rgba(30,210,235,0.14); color:#1ED2EB; border:1px solid rgba(30,210,235,0.32); }
  .tag-base { background:rgba(240,180,41,0.12); color:#f0b429; border:1px solid rgba(240,180,41,0.3); }
  .tag-lose { background:rgba(155,157,164,0.1); color:#9B9DA4; border:1px solid rgba(155,157,164,0.25); }

  /* GPU rack */
  .gpu-panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px 20px; }
  .gpu-compare { display:flex; gap:46px; align-items:flex-end; justify-content:center; padding:18px 0 6px; }
  .gpu-col { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .gpu-stack { display:flex; flex-direction:column-reverse; gap:6px; }
  .gpu-slot { position:relative; width:132px; height:21px; border-radius:5px; border:1px dashed rgba(255,255,255,0.07); }
  .gpu-unit { position:absolute; inset:0; border-radius:4px; background:linear-gradient(180deg,#7d828d,#565b66); overflow:hidden; transition:opacity .55s ease, transform .55s ease; }
  .gpu-unit .gu-on { position:absolute; inset:0; background:linear-gradient(180deg,#5ce6ff,#12a0b5); opacity:0; transition:opacity .55s ease; }
  .gpu-unit.on { box-shadow:0 0 18px rgba(30,210,235,0.5); }
  .gpu-unit.on .gu-on { opacity:1; }
  .gpu-unit.off { opacity:0; transform:scaleY(0.35) translateX(28px); }
  .gpu-col-lbl { font-size:13px; color:#9ba3b5; text-align:center; }
  .gpu-col-lbl b { display:block; font-family:var(--mono); font-size:20px; color:#fff; margin-bottom:2px; }
  .gpu-col-lbl.after b { color:#1ED2EB; }
  .gpu-arrow-mid { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding-bottom:34px; }
  .gpu-arrow-mid .ga { font-size:26px; color:#3f4756; }
  .gpu-arrow-mid .gl { font-family:var(--mono); font-size:13px; color:#1ED2EB; font-weight:700; white-space:nowrap; }

  .kimi-quote { border-left:3px solid #1ED2EB; padding:4px 0 4px 18px; font-size:15px; color:#c8d4e8; line-height:1.65; }
  .kimi-quote b { color:#fff; }


  /* ======= REALTIME STRIP ======= */
  .rt-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px 14px; }
  .rt-wrap { position:relative; margin:40px 8px 48px; }
  .rt-strip { position:relative; height:54px; border-radius:10px; overflow:hidden; border:1px solid var(--border); display:flex; }
  .rt-zone { position:absolute; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:10.5px; color:#79808f; line-height:1.35; border-right:1px solid rgba(0,0,0,0.45); padding:0 4px; }
  .rt-zone b { font-family:var(--mono); font-size:11px; color:#a8b0c0; margin-top:2px; }
  .rt-zone.z0 { background:linear-gradient(180deg,#191d25,#14171d); }
  .rt-zone.z1 { background:linear-gradient(180deg,rgba(251,146,60,0.16),rgba(251,146,60,0.06)); }
  .rt-zone.z1 b { color:#fb923c; }
  .rt-zone.z2 { background:linear-gradient(180deg,rgba(52,211,153,0.16),rgba(52,211,153,0.06)); }
  .rt-zone.z2 b { color:#34d399; }
  .rt-zone.z3 { background:linear-gradient(180deg,rgba(30,210,235,0.2),rgba(30,210,235,0.07)); }
  .rt-zone.z3 b { color:#1ED2EB; }
  .rt-mark { position:absolute; top:-7px; height:68px; width:2px; z-index:5; }
  .rt-mark.before { background:#b9bec8; box-shadow:0 0 8px rgba(185,190,200,0.35); }
  .rt-mark.after  { background:#1ED2EB; box-shadow:0 0 14px rgba(30,210,235,0.8); }
  .rt-cap { position:absolute; white-space:nowrap; font-size:11.5px; font-family:var(--mono); padding:4px 9px; border-radius:7px; }
  .rt-mark.before .rt-cap { top:74px; background:rgba(155,157,164,0.1); color:#9B9DA4; border:1px solid rgba(155,157,164,0.28); }
  .rt-mark.after  .rt-cap { top:-32px; background:rgba(30,210,235,0.12); color:#1ED2EB; border:1px solid rgba(30,210,235,0.35); font-weight:700; }
  .rt-jump { position:absolute; top:22px; height:10px; border-top:1px dashed rgba(30,210,235,0.5); border-right:1px dashed rgba(30,210,235,0.5); z-index:4; }
.rt-zone-legend { display:none; gap:8px 14px; flex-wrap:wrap; margin:-18px 0 14px; }
  .rzl { display:flex; align-items:center; gap:5px; font-size:11px; color:#79808f; }
  .rzl i { width:10px; height:10px; border-radius:3px; display:block; }
  .rzl.z0 i{background:#242933} .rzl.z1 i{background:#fb923c} .rzl.z2 i{background:#34d399} .rzl.z3 i{background:#1ED2EB}
  .rzl b { font-family:var(--mono); color:#a8b0c0; font-weight:400; }
  .rt-verdict { font-size:13.5px; color:#c8d4e8; line-height:1.6; border-top:1px solid var(--border); padding-top:12px; margin-top:6px; }
  .rt-verdict b { color:#fff; }
  .rt-verdict .up { color:#1ED2EB; font-weight:700; }
  .rt-fps { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .rt-fps-chip { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:12.5px; color:#8a90a0; }
  .rt-fps-chip b { font-family:var(--mono); font-size:16px; color:#fff; margin-left:6px; }
  .rt-fps-chip.on b { color:#1ED2EB; }

  /* ======= PEER RANK ======= */
  .peer-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 22px 16px; }
  .peer-row { display:grid; grid-template-columns:212px 1fr 84px; align-items:center; gap:12px; padding:5px 0; }
  .peer-name { text-align:right; font-size:12.5px; color:#7a8296; line-height:1.3; }
  .peer-name b { color:#9ba3b5; font-weight:600; }
  .peer-row.me .peer-name b { color:#fff; }
  .peer-track { height:16px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; }
  .peer-fill { height:100%; border-radius:5px; width:0; background:linear-gradient(90deg,#3a4150,#5a6272); transition:width .8s cubic-bezier(0.22,1,0.36,1); }
  .peer-row.me .peer-fill { background:linear-gradient(90deg,#0e7f92,#1ED2EB); box-shadow:0 0 14px rgba(30,210,235,0.35); }
  .peer-val { font-family:var(--mono); font-size:14px; color:#8a90a0; font-weight:700; }
  .peer-row.me .peer-val { color:#1ED2EB; font-size:16px; }

  /* ======= COMPARE VIEW ======= */
  .cmp-head { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 20px; }
  .cmp-title { font-size:20px; font-weight:800; color:#fff; margin-bottom:5px; }
  .cmp-desc { font-size:13px; color:#8a90a0; line-height:1.6; }
  .cmp-controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .cmp-chip { background:var(--surface2); border:1px solid var(--border); color:#9ba3b5; border-radius:20px; padding:6px 14px; font-size:12.5px; cursor:pointer; font-family:var(--font); transition:all .18s; }
  .cmp-chip:hover { color:#fff; border-color:#2c3444; }
  .cmp-chip.on { background:rgba(0,212,255,0.12); border-color:rgba(0,212,255,0.4); color:#1ED2EB; font-weight:600; }
  .cmp-sep { width:1px; height:20px; background:var(--border); margin:0 4px; }
  .cmp-table { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:8px 20px 16px; }
  .cmp-hdr { display:grid; grid-template-columns:230px 1fr 216px 72px; gap:14px; padding:12px 0 10px; border-bottom:1px solid var(--border); font-size:11px; font-family:var(--mono); color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .cmp-hdr span:nth-child(3),.cmp-hdr span:nth-child(4) { text-align:right; }
  .cmp-row { display:grid; grid-template-columns:230px 1fr 216px 72px; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(30,35,48,0.5); cursor:pointer; transition:background .15s; font-family:var(--font); text-align:left; width:100%; background:none; border-left:none; border-right:none; border-top:none; }
  .cmp-row:hover { background:rgba(255,255,255,0.025); }
  .cmp-nm { font-size:13.5px; font-weight:700; color:#fff; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmp-hw { font-size:11px; font-family:var(--mono); color:#6b7280; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmp-bar { height:20px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; position:relative; }
  .cmp-fill { height:100%; border-radius:5px; width:0; transition:width .75s cubic-bezier(0.22,1,0.36,1); }
  .cmp-g-server     { background:linear-gradient(90deg,#0e7f92,#1ED2EB); }
  .cmp-g-ondevice   { background:linear-gradient(90deg,#7c3aed,#a78bfa); }
  .cmp-g-yolo       { background:linear-gradient(90deg,#059669,#34d399); }
  .cmp-g-industrial { background:linear-gradient(90deg,#c2410c,#fb923c); }
  .cmp-g-edge       { background:linear-gradient(90deg,#a16207,#f0b429); }
  .cmp-g-detail-cv  { background:linear-gradient(90deg,#4b5563,#9ca3af); }
  .cmp-ba { font-family:var(--mono); font-size:12px; color:#8a90a0; text-align:right; white-space:nowrap; overflow:hidden; line-height:1.55; }
  .cmp-ba-l { font-family:var(--font); font-size:11.5px; color:#6b7280; overflow:hidden; text-overflow:ellipsis; }
  .cmp-ba b { color:#c8d4e8; }
  .cmp-ratio { font-family:var(--mono); font-size:17px; font-weight:700; color:#1ED2EB; text-align:right; }
  .cmp-note { font-size:12.5px; color:#8a90a0; line-height:1.6; padding:0 4px 12px; }
  .cmp-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; }
  .cmp-lg { display:flex; align-items:center; gap:6px; font-size:12px; color:#8a90a0; }
  .cmp-lg i { width:12px; height:12px; border-radius:3px; display:block; }
  .cmp-empty { padding:40px; text-align:center; color:var(--muted); font-size:13.5px; }


  .cust-box { font-size:13px; color:#8a90a0; line-height:1.6; padding:0 6px; margin-top:-4px; }
  .uc-grid { display:grid; grid-template-columns:1.15fr 1fr 1.3fr; gap:12px; }
  .uc-col { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:15px 18px; position:relative; overflow:hidden; }
  .uc-col::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,#4b5563,transparent); }

const btnRefs = {};
GROUPS.forEach(g => {
  const idxs = models.map((m,i)=>({m,i})).filter(x=>x.m.group===g.key);
  if (!idxs.length) return;
  const sec = document.createElement('div');
  sec.className = 'sidebar-section';
  const collapsed = COLLAPSED_BY_DEFAULT.includes(g.key);
  if (collapsed) sec.classList.add('collapsed');
  sec.dataset.defCollapsed = collapsed ? '1' : '';
  const lbl = document.createElement('button');
  lbl.className = 'sidebar-label';
  lbl.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  lbl.innerHTML = `<span class="sl-txt">${g.short || g.label}</span><span class="cnt">${idxs.length}</span><span class="chev">▾</span>`;
  lbl.onclick = () => {
    const now = sec.classList.toggle('collapsed');
    lbl.setAttribute('aria-expanded', now ? 'false' : 'true');
  };
  sec.appendChild(lbl);
  const list = document.createElement('div');
  list.className = 'model-list';
  idxs.forEach(({m,i}) => {
    const btn = document.createElement('button');
    btn.className = 'model-btn';
    btn.innerHTML = `<span class="dot"></span><span class="btn-txt">${m.name}${m.sub?`<span class="btn-sub">${m.sub}</span>`:''}</span>`;
    btn.onclick = () => { goTo(i); };
    btn.dataset.key = [m.name, m.sub||'', m.task||'', g.label, (m.hw||[]).map(h=>h.name+' '+h.exec).join(' '), (m.tech||[]).join(' ')].join(' ').toLowerCase();
    btn.dataset.idx = i;
    btnRefs[i] = btn;
    list.appendChild(btn);
  });
  sec.appendChild(list);
  sec.dataset.group = g.key;
  sidebar.appendChild(sec);
});

function setActive(btn) {
  if (activeBtn) activeBtn.classList.remove('active');
  ovBtn.classList.remove('active');
  cmpBtn.classList.remove('active');
  btn.classList.add('active');
  activeBtn = btn;
}
function selectModel(idx) {
  const m = models[idx];
  const mc = document.getElementById('mainContent');
  mc.scrollTop = 0; window.scrollTo(0,0);
  if (m.customChart === 'kimi') renderKimi(m);
  else if (m.type === 'llm') renderLLM(m);
  else if (m.type === 'cv') renderCV(m);
  else renderBench(m);
}
function expandFor(btn) {
  const sec = btn.closest('.sidebar-section');
  if (sec && sec.classList.contains('collapsed')) {
    sec.classList.remove('collapsed');
    const lb = sec.querySelector('.sidebar-label');
    if (lb) lb.setAttribute('aria-expanded','true');
  }
}
function goTo(idx) {
  setActive(btnRefs[idx]); selectModel(idx); expandFor(btnRefs[idx]);
  btnRefs[idx].scrollIntoView({block:'nearest'});
  setHash(slugOf(models[idx]));
  closeSidebar();
}

// ── 해시 라우팅 (공유 가능한 URL) ──────────────────────
function slugOf(m) {
  return (m.name + (m.sub ? '-' + m.sub : '')).toLowerCase()
    .replace(/[^\w가-힣]+/g,'-').replace(/^-+|-+$/g,'');
}
let suppressHash = false;
function setHash(h) { suppressHash = true; location.hash = '#/' + h; setTimeout(()=>suppressHash=false, 30); }
function routeFromHash(initial) {
  const h = decodeURIComponent((location.hash||'').replace(/^#\/?/,''));
  if (!h || h === 'overview') { setActive(ovBtn); renderOverview(); return; }
  if (h === 'compare')        { setActive(cmpBtn); renderCompare(); return; }
  const idx = models.findIndex(m => slugOf(m) === h);
  if (idx >= 0) { setActive(btnRefs[idx]); selectModel(idx); expandFor(btnRefs[idx]); btnRefs[idx].scrollIntoView({block:'nearest'}); }
  else if (initial) { setActive(ovBtn); renderOverview(); }
}
window.addEventListener('hashchange', () => { if (!suppressHash) routeFromHash(false); });

// ── 사이드바 검색 ─────────────────────────────────────
const sbSearch = document.getElementById('sbSearch');
const sbCount  = document.getElementById('sbCount');
function applyFilter() {
  const q = sbSearch.value.trim().toLowerCase();
  let shown = 0;
  sidebar.querySelectorAll('.sidebar-section').forEach(sec => {
    let any = false;
    sec.querySelectorAll('.model-btn').forEach(b => {
      const hit = !q || b.dataset.key.includes(q);
      b.style.display = hit ? '' : 'none';
      if (hit) { any = true; shown++; }
    });
    sec.style.display = any ? '' : 'none';
    const lb = sec.querySelector('.sidebar-label');
    const cn = sec.querySelector('.cnt');
    if (cn) { const hits = sec.querySelectorAll('.model-btn:not([style*="none"])').length;
              cn.textContent = q ? hits : sec.querySelectorAll('.model-btn').length; }
    if (q) { if (any) sec.classList.remove('collapsed'); }
    else   { sec.classList.toggle('collapsed', !!sec.dataset.defCollapsed); }
    if (lb) lb.setAttribute('aria-expanded', sec.classList.contains('collapsed') ? 'false' : 'true');
  });
  sbCount.textContent = q ? shown + '건' : '';
  let nr = document.getElementById('sbNoResult');
  if (!shown && q) {
    if (!nr) { nr = document.createElement('div'); nr.id='sbNoResult'; nr.className='sb-noresult'; nr.textContent='검색 결과가 없습니다'; sidebar.appendChild(nr); }
  } else if (nr) nr.remove();
  kbIdx = -1; paintKb();
}
sbSearch.addEventListener('input', applyFilter);

// ── 키보드 내비게이션 ─────────────────────────────────
let kbIdx = -1;
const visibleBtns = () => Array.from(sidebar.querySelectorAll('.model-btn')).filter(b => b.style.display !== 'none' && !b.closest('.sidebar-section').classList.contains('collapsed'));
function paintKb() {
  sidebar.querySelectorAll('.model-btn').forEach(b => b.classList.remove('kb'));
  const v = visibleBtns();
  if (kbIdx >= 0 && v[kbIdx]) { v[kbIdx].classList.add('kb'); v[kbIdx].scrollIntoView({block:'nearest'}); }
}
document.addEventListener('keydown', e => {
  const typing = document.activeElement === sbSearch;
  if (e.key === '/' && !typing) { e.preventDefault(); sbSearch.focus(); sbSearch.select(); return; }
  if (e.key === 'Escape') { if (typing) { sbSearch.value=''; applyFilter(); sbSearch.blur(); } closeSidebar(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const v = visibleBtns(); if (!v.length) return;
    e.preventDefault();
    if (kbIdx < 0) kbIdx = v.findIndex(b => b.classList.contains('active'));
    kbIdx = Math.min(Math.max(kbIdx + (e.key === 'ArrowDown' ? 1 : -1), 0), v.length - 1);
    paintKb();
  }
  if (e.key === 'Enter') {
    const v = visibleBtns();
    if (kbIdx >= 0 && v[kbIdx]) { e.preventDefault(); goTo(+v[kbIdx].dataset.idx); }
  }
});

function hwCls(exec) {
  return exec==='GPU' ? 'hw-gpu' : exec==='NPU' ? 'hw-npu' : exec==='DSP' ? 'hw-dsp' : exec==='MCU' ? 'hw-mcu' : 'hw-cpu';
}
function modelHeaderHTML(model) {
  const hwChips = (model.hw||[]).map(h =>
    `<div class="hw-chip"><span class="hw-icon">${hwIcon(h.exec)}</span>${h.name}<span class="hw-type ${hwCls(h.exec)}">${h.exec}</span></div>`
  ).join('');
  return `
  <div class="model-header-card anim-0">
    <div class="model-title-row">
      <div class="model-title-left">
        <h2>${model.name}${model.sub?` <span style="font-size:15px;font-weight:500;color:#7a8296">· ${model.sub}</span>`:''}</h2>
        <div class="model-task-badge">${model.task}${model.inputSize && model.inputSize!=='—' ? ` · 입력 ${model.inputSize}` : ''}</div>
      </div>
    </div>
    <div class="hw-grid">${hwChips}</div>
  </div>`;
}
function fmt(n) {
  if (n === null || n === undefined) return '—';
  if (Number.isInteger(n)) return n.toLocaleString();
  return n.toLocaleString(undefined,{maximumFractionDigits:3});
}

// BENCH RENDERER (최적화 전 / 후)
// ═══════════════════════════════════════════════════════════
function renderBench(model) {
  const main = document.getElementById('mainContent');

  const techHTML = model.tech && model.tech.length
    ? `<div class="tech-row anim-1"><span class="tech-row-label">적용 기술</span>${model.tech.map(t=>`<span class="tech-chip">${t}</span>`).join('')}</div>` : '';

  const specHTML = model.spec ? `<div class="spec-box anim-1">${model.spec}</div>` : '';

  const c = model.context;
  const ucHTML = c ? `
    <div class="uc-grid anim-1">
      <div class="uc-col"><div class="uc-h">배경</div><p>${c.background}</p></div>
      <div class="uc-col"><div class="uc-h ch">과제</div><ul>${c.challenge.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="uc-col sol"><div class="uc-h so">NetsPresso 솔루션</div><ul>${c.solution.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>` : '';
  const custHTML = model.customer ? `<div class="cust-box anim-0">${model.customer}</div>` : '';

  const cards = model.metrics.map((mt, i) => {
    const maxV = Math.max(mt.before, mt.after) || 1;
    const bPct = (mt.before/maxV*100).toFixed(1);
    const aPct = (mt.after /maxV*100).toFixed(1);
    let deltaTxt, deltaCls = '';
    if (mt.unlock) { deltaTxt = `▲ ${fmt(mt.before)} → ${fmt(mt.after)} ${mt.unit}`; }
    else if (mt.keep) { deltaTxt = mt.keepText || '성능 유지'; deltaCls = 'keep'; }
    else if (mt.lowerBetter) {
      const red = ((1 - mt.after/mt.before)*100).toFixed(1).replace(/\.0$/,'');
      const ratio = (mt.before/mt.after).toFixed(1);
      deltaTxt = `▼ ${red}% 절감 · ${ratio}× `;
    } else {
      const imp = ((mt.after/mt.before - 1)*100).toFixed(1).replace(/\.0$/,'');
      const ratio = (mt.after/mt.before).toFixed(1);
      deltaTxt = `▲ ${imp}% 향상 · ${ratio}× `;
    }
    return `
      <div class="bench-card ${mt.keep?'keep':''}">
        <div class="bench-head">
          <div><span class="bench-metric-name">${mt.label}</span><span class="bench-metric-unit">단위: ${mt.unit}</span></div>
          <span class="bench-delta ${mt.keep?'keep':''}">${deltaTxt}</span>
        </div>
        <div class="bench-rows">
          <div class="bench-row before">
            <div class="bench-row-lbl">${model.beforeLabel||'원본 모델'}</div>
            <div class="bench-track"><div class="bench-fill orig" id="bf-o-${i}" data-w="${bPct}"></div></div>
            <div class="bench-row-val">${fmt(mt.before)} <span style="font-size:12px;color:#6b7280">${mt.unit}</span></div>
          </div>
          <div class="bench-row after">
            <div class="bench-row-lbl">${model.afterLabel||'노타 경량화 모델'}</div>
            <div class="bench-track"><div class="bench-fill opt ${mt.keep?'keep':''}" id="bf-a-${i}" data-w="${aPct}"></div></div>
            <div class="bench-row-val">${fmt(mt.after)} <span style="font-size:12px;color:#6b7280">${mt.unit}</span></div>
          </div>
        </div>
      </div>`;
  }).join('');

  const chartHTML = model.customChart === 'kimi' ? kimiChartHTML() : '';

  // 요약 KPI 카드
  const kpi = model.metrics.map(mt => {
    if (mt.unlock) return `<div class="speedup-card s-npu">
      <div class="speedup-device">${mt.label}</div>
      <div class="speedup-value npu">${fmt(mt.before)} → ${fmt(mt.after)}</div>
      <div class="speedup-label">${mt.unit} · 기존 실행 불가 구간을 신규 확보</div></div>`;
    if (mt.keep) return `<div class="speedup-card s-gpu" style="--x:0">
      <div class="speedup-device">${mt.label}</div>
      <div class="speedup-value" style="background:linear-gradient(135deg,#34d399,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">${mt.keepText||'유지'}</div>
      <div class="speedup-label">${fmt(mt.before)} → ${fmt(mt.after)} ${mt.unit}</div></div>`;
    const ratio = mt.lowerBetter ? (mt.before/mt.after) : (mt.after/mt.before);
    const pct = mt.lowerBetter
      ? `${((1-mt.after/mt.before)*100).toFixed(1).replace(/\.0$/,'')}% 절감`
      : `${((mt.after/mt.before-1)*100).toFixed(1).replace(/\.0$/,'')}% 향상`;
    return `<div class="speedup-card ${mt.lowerBetter?'s-gpu':'s-npu'}">
      <div class="speedup-device">${mt.label}</div>
      <div class="speedup-value${mt.lowerBetter?'':' npu'}">${ratio.toFixed(1)}×</div>
      <div class="speedup-label">${pct} · ${fmt(mt.before)} → ${fmt(mt.after)} ${mt.unit}</div></div>`;
  }).join('');

  // 지연/FPS 지표가 있으면 실시간 처리 구간 스트립
  const lat = model.metrics.find(x => x.unit === 'ms' || x.unit === 'FPS');
  const rtHTML = lat
    ? realtimeStripHTML(
        lat.unit === 'FPS' ? 1000/lat.before : lat.before,
        lat.unit === 'FPS' ? 1000/lat.after  : lat.after,
        lat.unit === 'FPS' ? '(FPS → ms 환산)' : '')
    : '';
  const peerHTML = peerRankHTML(model);

  const rr = model.runtimeRows || [];
  const condRows = [
    ['정확도 영향', model.accuracyNote || null],
    ['최적화 전 실행 조건', model.beforeLabel || '원본 모델'],
    ['최적화 후 실행 조건', model.afterLabel || '노타 경량화 모델'],
    ['적용 기법', (model.tech||[]).join(', ') || null],
    ...rr,
  ].filter(([,v]) => v);
  const condHTML = condRows.length ? `
    <div class="cond-card anim-3">
      <div class="metrics-title">측정 · 검증 조건</div>
      ${condRows.map(([k,v]) => `<div class="cond-row"><span class="cond-k">${k}</span>
        <span class="cond-v">${v}</span></div>`).join('')}
    </div>` : '';

  main.innerHTML = `
    ${modelHeaderHTML(model)}
    ${custHTML}
    ${specHTML}
    ${ucHTML}
    ${techHTML}
    ${chartHTML}
    <div class="speedup-section anim-2">${kpi}</div>
    <div class="bench-grid anim-2">${cards}</div>
    ${rtHTML}
    ${condHTML}
    ${peerHTML}
    ${model.summary ? `<div class="bench-summary anim-3">${model.summary}</div>` : ''}
    ${model.footnote ? `<div class="bench-footnote anim-3">※ ${model.footnote}</div>` : ''}`;

  requestAnimationFrame(()=>setTimeout(()=>{
    model.metrics.forEach((_,i)=>{
      const o=document.getElementById(`bf-o-${i}`), a=document.getElementById(`bf-a-${i}`);
      if(o) o.style.width=o.dataset.w+'%';
      if(a) a.style.width=a.dataset.w+'%';
    });
    document.querySelectorAll('.peer-fill').forEach(el => { el.style.width = el.dataset.w+'%'; });
  },80));
}

// KIMI K3 — 전용 드라마틱 렌더러

function countUp(el, to, dur, dec, delay) {
  if (!el) return;
  const t0 = performance.now() + (delay||0);
  const step = (now) => {
    const p = Math.min(Math.max((now - t0) / dur, 0), 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = (to * e).toFixed(dec);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function animateKimiChart() {
  setTimeout(()=>{
    ['kimi-reap','kimi-nota'].forEach((id,k)=>{
      const p = document.getElementById(id);

      const L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      p.style.transition = `stroke-dashoffset 1.15s cubic-bezier(0.33,1,0.68,1) ${k*0.18+0.15}s`;
      requestAnimationFrame(()=>{ p.style.strokeDashoffset = 0; });
    });
    ['kimi-adv','kimi-dots','kimi-anno','kimi-dim'].forEach((id,k)=>{
      const el = document.getElementById(id);
      if (!el) return;
      el.style.transition = `opacity 0.6s ease ${1.15 + k*0.16}s`;
      requestAnimationFrame(()=>{ el.style.opacity = 1; });
    });
    const pulse = document.getElementById('kimi-pulse');
    if (pulse) { pulse.style.transition='opacity .5s ease 1.55s'; requestAnimationFrame(()=>pulse.style.opacity=1); }
  }, 60);
}

// ═══════════════════════════════════════════════════════════
// CV RENDERER (기존)
// ═══════════════════════════════════════════════════════════
function beforeAfterBannerHTML(model) {
  const sMap = {};
  model.data.forEach(d => { if (!sMap[d.device]) sMap[d.device] = {}; sMap[d.device][d.type] = d.value; });
  let cards = '';
  Object.entries(sMap).forEach(([dev, t]) => {
    const origVal = t.original, gpuVal = t.optimized, npuVal = t.optimized_npu;
    if (origVal !== undefined && origVal !== null) {
      cards += `<div class="ba-card before-card">
        <div class="ba-label orig-lbl">최적화 전</div>
        <div class="ba-hw">${dev}</div>
        <div class="ba-time">${origVal} ms</div>
      </div>`;
    } else if (origVal === null) {
      cards += `<div class="ba-card before-card">
        <div class="ba-label orig-lbl">최적화 전</div>
        <div class="ba-hw">${dev}</div>
        <div class="ba-time na">NPU 실행 불가</div>
      </div>`;
    }
    if (gpuVal !== undefined && gpuVal !== null) {
      const ratio = origVal ? (origVal/gpuVal).toFixed(1) : null;
      cards += `<div class="ba-speedup-arrow">→</div>
      <div class="ba-card after-card-gpu">
        <div class="ba-label gpu-lbl">최적화 후 (GPU)</div>
        <div class="ba-hw">${dev}</div>
        <div class="ba-time">${gpuVal} ms</div>
        ${ratio?`<div class="ba-speedup-pill pill-gpu">⚡ ${ratio}× 빠름</div>`:''}
      </div>`;
    }
    if (npuVal !== undefined && npuVal !== null) {
      const ratioNpu = origVal ? (origVal/npuVal).toFixed(1) : null;
      cards += `<div class="ba-speedup-arrow">→</div>
      <div class="ba-card after-card-npu">
        <div class="ba-label npu-lbl">최적화 후 (NPU)</div>
        <div class="ba-hw">${dev}</div>
        <div class="ba-time">${npuVal} ms</div>
        ${ratioNpu?`<div class="ba-speedup-pill pill-npu">⚡ ${ratioNpu}× 빠름</div>`:
          `<div class="ba-speedup-pill pill-npu">NPU 실행 가능</div>`}
      </div>`;
    }
  });
  return `<div class="before-after-banner anim-1">
    <div class="ba-header">
      <span>추론 시간 비교 — 최적화 전 vs 후</span>
      <span>단위: ms (낮을수록 우수)</span>
    </div>
    <div class="ba-cards">${cards}</div>
  </div>`;
}

function renderCV(model) {
  const main = document.getElementById('mainContent');
  if (!model.data || model.data.length === 0) { main.innerHTML = emptyPage(model); return; }

  const validVals = model.data.filter(d=>d.value!==null).map(d=>d.value);
  const yMax = Math.ceil(Math.max(...validVals)*1.2/50)*50||100;
  const ySteps = 5;
  const yLabels = Array.from({length:ySteps+1},(_,i)=>Math.round(yMax*(ySteps-i)/ySteps));

  const sMap = {};
  model.data.forEach(d=>{ if(!sMap[d.device]) sMap[d.device]={}; sMap[d.device][d.type]=d.value; });
  let speedupHTML = '';
  Object.entries(sMap).forEach(([dev,t]) => {
    if (t.original && t.optimized)     speedupHTML += speedCard(dev + ' — GPU', (t.original/t.optimized).toFixed(1), false);
    if (t.original && t.optimized_npu) speedupHTML += speedCard(dev + ' — NPU', (t.original/t.optimized_npu).toFixed(1), true);
    if (t.original===null && t.optimized!==null && t.optimized_npu!==null)
      speedupHTML += `<div class="speedup-card s-npu">
        <div class="speedup-device">최적화로 잠금 해제</div>
        <div class="speedup-enabled">원래 NPU 실행 불가<br>그래프 최적화 후 NPU 실행 가능해짐</div>
      </div>`;
  });

  const barsHTML = model.data.map((d,i) => {
    const h = d.value!==null ? (d.value/yMax*100).toFixed(1) : 8;
    const isNA = d.value===null;
    const badge = d.type==='original'
      ? `<span style="color:#9B9DA4;font-weight:600">원본</span>`
      : d.type==='optimized'
      ? `<span style="color:#1ED2EB;font-weight:600">GPU</span>`
      : `<span style="color:#a78bfa;font-weight:600">NPU</span>`;
    const lines = d.label.split('\n');
    const xLabel = `<div class="x-label"><span>${lines[0]}</span><br><span style="font-size:11px;color:#8a90a0">${lines[1]||''}</span><br>${badge}</div>`;
    const tooltipTxt = isNA ? '지원 불가' : `${d.type==='original'?'원본':'최적화'}: ${d.value} ms`;
    return { barHTML:`
      <div class="bar-group"><div class="bar-wrapper">
        <div class="bar-value" id="bv${i}">${isNA?'N/A':d.value+' ms'}</div>
        <div class="bar ${d.type}${isNA?' na':''}" id="bar${i}" style="height:0" data-target="${h}">
          <div class="bar-tooltip">${tooltipTxt}</div>
        </div>
      </div></div>`, xLabel };
  });

  const hasOrig = model.data.some(d=>d.type==='original');
  const hasGPU  = model.data.some(d=>d.type==='optimized');
  const hasNPU  = model.data.some(d=>d.type==='optimized_npu');
  const legend  = (hasOrig?`<div class="legend-item"><div class="legend-dot" style="background:#9B9DA4"></div>원본</div>`:'')
                + (hasGPU ?`<div class="legend-item"><div class="legend-dot" style="background:#1ED2EB"></div>최적화 (GPU)</div>`:'')
                + (hasNPU ?`<div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>최적화 (NPU)</div>`:'');

  let accHTML = '';
  if (model.accuracy) {
    const diff = (model.accuracy.original - model.accuracy.optimized).toFixed(2);
    accHTML = `<div class="metrics-section anim-3">
      <div class="metrics-title">정확도 — ${model.accuracy.metric}</div>
      <div class="metrics-row">
        <div class="metric-card orig-card"><div class="metric-type">최적화 전 (원본)</div><div class="metric-value">${model.accuracy.original}%</div><div class="metric-label">${model.accuracy.metric}</div></div>
        <div class="metrics-divider"></div>
        <div class="metric-card opt-card"><div class="metric-type">최적화 후</div><div class="metric-value">${model.accuracy.optimized}%</div><div class="metric-label">${model.accuracy.metric}</div><div class="metric-diff">-${diff}%</div></div>
      </div></div>`;
  } else if (model.accuracyMulti) {
    const cards = model.accuracyMulti.map((a,i) => {
      const cls = a.type==='npu'?'opt-npu-card':'opt-card';
      return `${i>0?'<div class="metrics-divider"></div>':''}<div class="metric-card ${cls}"><div class="metric-type">${a.label}</div><div class="metric-value">${a.value}%</div><div class="metric-label">mAP50</div></div>`;
    }).join('');
    accHTML = `<div class="metrics-section anim-3"><div class="metrics-title">정확도 — mAP50</div><div class="metrics-row">${cards}</div></div>`;
  }

  main.innerHTML = `
    ${modelHeaderHTML(model)}
    ${beforeAfterBannerHTML(model)}
    <div class="chart-section anim-2">
      <div class="chart-header">
        <div class="chart-title">추론 시간 상세 (ms)</div>
        <div class="legend">${legend}</div>
      </div>
      <div class="chart-wrapper">
        <div class="y-axis">${yLabels.map(v=>`<div class="y-label">${v>=1000?(v/1000).toFixed(1)+'k':v}</div>`).join('')}</div>
        <div class="chart-area">
          <div class="grid-and-bars">
            ${yLabels.map((_,i)=>`<div class="grid-line" style="top:${(i/ySteps*100).toFixed(1)}%"></div>`).join('')}
            <div class="bars-container">${barsHTML.map(b=>b.barHTML).join('')}</div>
          </div>
          <div class="x-axis">${barsHTML.map(b=>b.xLabel).join('')}</div>
        </div>
      </div>
    </div>
    <div class="speedup-section anim-3">${speedupHTML}</div>
    ${accHTML}`;

  requestAnimationFrame(()=>setTimeout(()=>{
    model.data.forEach((_,i)=>{
      const bar=document.getElementById(`bar${i}`), bv=document.getElementById(`bv${i}`);
      if(bar) bar.style.height=bar.dataset.target+'%';
      if(bv)  bv.style.opacity='1';
    });
  },80));
}

// ═══════════════════════════════════════════════════════════
// LLM RENDERER (기존)
// ═══════════════════════════════════════════════════════════
const TTFT_REALTIME = 1000;
const DEC_FLUENT    = 10;
const CARD_COLORS = ['dc-blue','dc-purple','dc-green','dc-orange','dc-blue','dc-purple'];

function realtimeBadge(ttftVal, decVal) {
  if (ttftVal <= TTFT_REALTIME && decVal >= DEC_FLUENT) return `<div class="dc-realtime-badge badge-realtime">● 실시간 대화 가능</div>`;
  if (ttftVal <= 2000 && decVal >= 6) return `<div class="dc-realtime-badge badge-neartime">● 준실시간 (체감 양호)</div>`;
  return `<div class="dc-realtime-badge badge-offline">● 오프라인 처리 수준</div>`;
}

function renderLLM(model) {
  const main = document.getElementById('mainContent');
  if (!model.ttft || model.ttft.length===0) { main.innerHTML = emptyPage(model); return; }

  const deviceCards = model.ttft.map((t, i) => {
    const dec = model.decoding[i];
    const colorCls = CARD_COLORS[i % CARD_COLORS.length];
    const badge = realtimeBadge(t.value, dec.value);
    const c = BAR_COLORS[t.color]||BAR_COLORS.blue;
    return `
      <div class="device-card ${colorCls}">
        <div><div class="dc-hw-name">${t.label}</div>${t.spec?`<div class="dc-spec">${t.spec}</div>`:''}${badge}</div>
        ${t.note?`<div class="dc-note">${t.note}</div>`:''}
        ${dec.boost?`<div class="dc-boost">${dec.boostLabel} 적용 시 <b>${dec.boost} tps</b></div>`:''}
        <div class="dc-metrics">
          <div class="dc-metric-row">
            <div class="dc-metric-header"><span class="dc-metric-label">TTFT (첫 토큰)</span><span class="dc-metric-val">${t.value===null?'N/A':t.value+' ms'}</span></div>
            <div class="dc-track">
              <div class="dc-fill" id="dcttft-${i}" style="background:${c.fill};width:0"></div>
              <div class="dc-baseline-line" style="left:60%;background:#f59e0b;opacity:0.7"></div>
              <div class="dc-baseline-label" style="left:60%;color:#f59e0b">1,000ms</div>
            </div>
          </div>
          <div class="dc-metric-row">
            <div class="dc-metric-header"><span class="dc-metric-label">디코딩 속도</span><span class="dc-metric-val">${dec.value} tps</span></div>
            <div class="dc-track">
              <div class="dc-fill" id="dcdec-${i}" style="background:${c.fill};width:0"></div>
              <div class="dc-baseline-line" style="left:60%;background:#10b981;opacity:0.7"></div>
              <div class="dc-baseline-label" style="left:60%;color:#10b981">10 tps</div>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  const ttftVals = model.ttft.filter(d=>d.value!==null);
  const maxTTFT     = Math.max(...ttftVals.map(d=>d.value), TTFT_REALTIME) * 1.25;
  const maxDecoding = Math.max(...model.decoding.map(d=>d.value), DEC_FLUENT) * 1.25;
  const ttftBasePct = (TTFT_REALTIME / maxTTFT * 100).toFixed(1);
  const decBasePct  = (DEC_FLUENT   / maxDecoding * 100).toFixed(1);

  main.innerHTML = `
    ${modelHeaderHTML(model)}
    <div class="llm-info-row anim-1">
      ${model.contextLength?`<div class="llm-info-chip">컨텍스트 길이 <strong>${model.contextLength.toLocaleString()} 토큰</strong></div>`:''}
      <div class="llm-info-chip">입력 크기 <strong>${model.inputSize}</strong></div>
      <div class="llm-info-chip">측정 대상 <strong>NetsPresso 최적화 모델</strong></div>
    </div>

    <div class="llm-framing-box anim-1">
      이 데이터는 <strong>NetsPresso로 최적화된 모델</strong>을 각 엣지 디바이스에서 실행한 결과입니다.
      최적화 전 원본 모델은 대부분의 엣지 디바이스에서 <strong>실행 자체가 불가능하거나 수십 배 느립니다.</strong>
      각 수치는 "최적화 후 엣지에서 이 속도가 나온다"는 의미입니다.
    </div>

    <div class="device-cards-grid anim-2">${deviceCards}</div>
    ${model.failNote?`<div class="fail-note anim-2">${model.failNote}</div>`:''}

    <div class="llm-chart-card anim-3">
      <div class="llm-chart-title">TTFT — 첫 토큰 생성 시간</div>
      <div class="llm-chart-subtitle">밀리초 (ms) · 낮을수록 우수 ↓</div>
      <div class="llm-baseline-note"><span class="baseline-dot-ttft"></span>기준선: 실시간 응답 (1,000 ms)</div>
      <div class="llm-bar-list">${llmBarListWithBaseline(ttftVals, maxTTFT, ttftBasePct, 'ttft', 'ms', false)}</div>
    </div>

    <div class="llm-chart-card anim-3">
      <div class="llm-chart-title">디코딩 속도</div>
      <div class="llm-chart-subtitle">초당 토큰 수 (tps) · 높을수록 우수 ↑</div>
      <div class="llm-baseline-note"><span class="baseline-dot-dec"></span>기준선: 유창한 대화 (10 tps)</div>
      <div class="llm-bar-list">${llmBarListWithBaseline(model.decoding, maxDecoding, decBasePct, 'dec', 'tps', true)}</div>
    </div>`;

  requestAnimationFrame(()=>setTimeout(()=>{
    model.ttft.forEach((d,i)=>{
      const elT = document.getElementById(`dcttft-${i}`), elD = document.getElementById(`dcdec-${i}`);
      if(elT) elT.style.width = d.value===null ? '0%' : Math.min((d.value / TTFT_REALTIME)*60, 95).toFixed(1)+'%';
      if(elD) elD.style.width = Math.min((model.decoding[i].value / DEC_FLUENT)*60, 95).toFixed(1)+'%';
    });
    ttftVals.forEach((d,i)=>{ const el=document.getElementById(`ttft-fill-${i}`); if(el) el.style.width=(d.value/maxTTFT*100).toFixed(1)+'%'; });
    model.decoding.forEach((d,i)=>{ const el=document.getElementById(`dec-fill-${i}`); if(el) el.style.width=(d.value/maxDecoding*100).toFixed(1)+'%'; });
  },80));
}

function llmBarListWithBaseline(items, maxVal, basePct, prefix, unit, higherBetter) {
  return items.map((d,i)=>{
    const c = BAR_COLORS[d.color]||BAR_COLORS.blue;
    const baselineColor = higherBetter ? '#10b981' : '#f59e0b';
    const passFail = higherBetter ? (d.value >= DEC_FLUENT) : (d.value <= TTFT_REALTIME);
    const badge = passFail
      ? `<span style="font-size:11px;padding:2px 7px;border-radius:10px;background:rgba(52,211,153,0.12);color:#34d399;border:1px solid rgba(52,211,153,0.3);font-family:var(--mono);">✓ 기준 충족</span>`
      : `<span style="font-size:11px;padding:2px 7px;border-radius:10px;background:rgba(251,146,60,0.12);color:#fb923c;border:1px solid rgba(251,146,60,0.3);font-family:var(--mono);">△ 기준 미달</span>`;
    return `
      <div class="llm-bar-row">
        <div class="llm-bar-header">
          <span class="llm-bar-label">${d.label}</span>
          <span class="llm-bar-val">${d.value} ${unit} ${badge}</span>
        </div>
        <div class="llm-track">
          <div class="llm-fill" id="${prefix}-fill-${i}" style="background:${c.fill};box-shadow:0 0 8px ${c.glow};width:0"></div>
          <div class="llm-baseline-marker" style="left:${basePct}%;background:${baselineColor};opacity:0.8">
            <div class="llm-baseline-tip" style="background:${baselineColor}22;color:${baselineColor};border:1px solid ${baselineColor}44">${higherBetter?'10 tps':'1,000ms'}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function speedCard(label, ratio, isNpu) {
  return `<div class="speedup-card ${isNpu?'s-npu':'s-gpu'}">
    <div class="speedup-device">${label}</div>
    <div class="speedup-value${isNpu?' npu':''}">${ratio}×</div>
    <div class="speedup-label">최적화 후 속도 향상</div>
  </div>`;
}

function emptyPage(model) {
  return `${modelHeaderHTML(model)}
    <div class="empty-state" style="flex:1;"><div class="empty-icon">📊</div><p>벤치마크 데이터 준비 중입니다</p></div>`;
}

// ═══════════════════════════════════════════════════════════
// 실시간 처리 구간 스트립 (지연 시간 → FPS 환산)
// ═══════════════════════════════════════════════════════════
const RT_HI = 2000, RT_LO = 0.2;                       // ms, 로그 스케일 범위
const rtX = ms => Math.min(Math.max((Math.log10(RT_HI) - Math.log10(ms)) / (Math.log10(RT_HI)-Math.log10(RT_LO)) * 100, 0.5), 99.5);
const RT_ZONES = [
  { to:100,   cls:'z0', t:'배치 · 오프라인',   s:'10 FPS 미만' },
  { to:33.34, cls:'z1', t:'준실시간',          s:'10–30 FPS' },
  { to:16.67, cls:'z2', t:'실시간',            s:'30–60 FPS' },
  { to:RT_LO, cls:'z3', t:'고속 실시간',       s:'60 FPS 이상' },
];
const rtZoneIdx = ms => ms > 100 ? 0 : ms > 33.34 ? 1 : ms > 16.67 ? 2 : 3;

function realtimeStripHTML(beforeMs, afterMs, unitNote) {
  const zones = RT_ZONES.map((z,i) => {
    const from = i === 0 ? RT_HI : RT_ZONES[i-1].to;
    const l = i === 0 ? 0 : rtX(from), r = i === RT_ZONES.length-1 ? 100 : rtX(z.to);
    return `<div class="rt-zone ${z.cls}" style="left:${l}%;width:${(r-l).toFixed(2)}%">${z.t}<b>${z.s}</b></div>`;
  }).join('');
  const mk = (ms, isAfter) => {
    const x = rtX(ms);
    const fps = 1000/ms;
    const tx = x < 16 ? 'translateX(0)' : x > 84 ? 'translateX(-100%)' : 'translateX(-50%)';
    const txt = `${isAfter?'최적화 후':'원본'} ${ms.toFixed(ms<10?2:1)}ms · ${fps < 10 ? fps.toFixed(1) : Math.round(fps)} FPS`;
    return `<div class="rt-mark ${isAfter?'after':'before'}" style="left:${x.toFixed(2)}%">
      <div class="rt-cap" style="transform:${tx}">${txt}</div></div>`;
  };
  const zi = rtZoneIdx(beforeMs), zo = rtZoneIdx(afterMs);
  const verdict = zi === zo
    ? `두 모델 모두 <b>${RT_ZONES[zi].t}</b> 구간이지만, 지연이 <span class="up">${(beforeMs/afterMs).toFixed(1)}배</span> 줄어 동일 하드웨어에서 처리량을 그만큼 더 확보합니다.`
    : `<b>${RT_ZONES[zi].t}(${RT_ZONES[zi].s})</b> 수준이던 모델이 최적화 후 <span class="up">${RT_ZONES[zo].t}(${RT_ZONES[zo].s})</span> 구간으로 올라섭니다.`;
  const bF = 1000/beforeMs, aF = 1000/afterMs;
  return `
    <div class="rt-card anim-3">
      <div class="metrics-title">실시간 처리 가능성 — 지연 시간 기준 ${unitNote||''}</div>
      <div class="rt-fps">
        <div class="rt-fps-chip">원본 처리량 <b>${bF<10?bF.toFixed(1):Math.round(bF)} FPS</b></div>
        <div class="rt-fps-chip on">최적화 후 처리량 <b>${aF<10?aF.toFixed(1):Math.round(aF)} FPS</b></div>
        <div class="rt-fps-chip">동시 처리 가능 채널 <b>×${(beforeMs/afterMs).toFixed(1)}</b></div>
      </div>
      <div class="rt-wrap">
        <div class="rt-strip">${zones}</div>
        ${mk(beforeMs,false)}${mk(afterMs,true)}
      </div>
      <div class="rt-zone-legend">${RT_ZONES.map(z=>`<span class="rzl ${z.cls}"><i></i>${z.t} <b>${z.s}</b></span>`).join('')}</div>
      <div class="rt-verdict">${verdict}</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// 개선 배수 계산 · 그룹 내 비교
// ═══════════════════════════════════════════════════════════
function primaryRatio(m) {
  if (m.type === 'bench') {
    const mt = m.metrics.find(x => !x.keep && !x.unlock) || m.metrics[0];
    if (!mt || mt.keep || mt.unlock || !mt.before || !mt.after) return null;
    return { r: mt.lowerBetter ? mt.before/mt.after : mt.after/mt.before, mt };
  }
  if (m.type === 'cv' && m.data) {
    const map = {};
    m.data.forEach(d => { if(!map[d.device]) map[d.device]={}; map[d.device][d.type]=d.value; });
    let best = null;
    Object.values(map).forEach(t => {
      if (!t.original) return;
      [t.optimized, t.optimized_npu].forEach(v => {
        if (v) { const r = t.original/v; if (!best || r > best.r) best = { r, mt:{ label:'추론 지연', unit:'ms', before:t.original, after:v, lowerBetter:true } }; }
      });
    });
    return best;
  }
  return null;
}

function peerRankHTML(model) {
  const peers = models.map((m,i)=>({m,i})).filter(x => x.m.group === model.group);
  if (peers.length < 3) return '';
  const rows = peers.map(({m,i}) => { const p = primaryRatio(m); return p ? {m,i,r:p.r} : null; })
                    .filter(Boolean).sort((a,b)=>b.r-a.r);
  if (rows.length < 3) return '';
  const maxR = Math.max(...rows.map(r=>r.r));
  const gLabel = (GROUPS.find(g=>g.key===model.group)||{}).label || '';
  return `
    <div class="peer-card anim-3">
      <div class="metrics-title">${gLabel} — 최적화 효과 순위</div>
      ${rows.map((r,k)=>`
        <div class="peer-row ${r.m===model?'me':''}">
          <div class="peer-name"><b>${r.m.name}</b> ${r.m.sub||''}</div>
          <div class="peer-track"><div class="peer-fill" id="pk-${k}" data-w="${Math.max(r.r/maxR*100,3).toFixed(1)}"></div></div>
          <div class="peer-val">${r.r.toFixed(1)}×</div>
        </div>`).join('')}
      <div class="bench-footnote" style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px">※ 각 사례의 대표 지표 기준 — 지표 종류(지연·메모리·크기 등)는 사례별로 다를 수 있습니다.</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// 사례 비교 뷰
// ═══════════════════════════════════════════════════════════
let cmpFilter = 'all', cmpSort = 'ratio';
function compareRows() {
  return models.map((m,i)=>{ const p = primaryRatio(m); return p ? {m,i,r:p.r,mt:p.mt} : null; }).filter(Boolean);
}
function renderCompare() {
  const main = document.getElementById('mainContent');
  main.scrollTop = 0;
  let rows = compareRows();
  const groupsPresent = GROUPS.filter(g => rows.some(r => r.m.group === g.key));
  if (cmpFilter !== 'all') rows = rows.filter(r => r.m.group === cmpFilter);
  rows = cmpSort === 'ratio' ? rows.sort((a,b)=>b.r-a.r)
       : rows.sort((a,b)=>GROUPS.findIndex(g=>g.key===a.m.group)-GROUPS.findIndex(g=>g.key===b.m.group) || b.r-a.r);
  const maxL = Math.log10(Math.max(...compareRows().map(r=>r.r)));

  const chips = [`<button class="cmp-chip ${cmpFilter==='all'?'on':''}" onclick="setCmp('filter','all')">전체 ${compareRows().length}</button>`]
    .concat(groupsPresent.map(g=>`<button class="cmp-chip ${cmpFilter===g.key?'on':''}" onclick="setCmp('filter','${g.key}')">${g.label}</button>`)).join('');
  const sorts = `<button class="cmp-chip ${cmpSort==='ratio'?'on':''}" onclick="setCmp('sort','ratio')">개선폭 순</button>
                 <button class="cmp-chip ${cmpSort==='group'?'on':''}" onclick="setCmp('sort','group')">그룹 순</button>`;

  const body = rows.length ? rows.map((r,k)=>{
    const mt = r.mt;
    const pctTxt = mt.lowerBetter ? `${((1-mt.after/mt.before)*100).toFixed(0)}% 절감` : `${((mt.after/mt.before-1)*100).toFixed(0)}% 향상`;
    return `<button class="cmp-row" onclick="goTo(${r.i})">
      <div><div class="cmp-nm">${r.m.name}${r.m.sub?` <span style="font-weight:400;color:#6b7280">· ${r.m.sub}</span>`:''}</div>
           <div class="cmp-hw">${(r.m.hw||[]).map(h=>h.name).join(' · ')}</div></div>
      <div class="cmp-bar"><div class="cmp-fill cmp-g-${r.m.group}" id="cf-${k}" data-w="${Math.max(Math.log10(r.r)/maxL*100,2).toFixed(1)}"></div></div>
      <div class="cmp-ba"><div class="cmp-ba-l">${mt.label}</div><div>${fmt(mt.before)} → <b>${fmt(mt.after)}</b> ${mt.unit} <span style="color:#6b7280">· ${pctTxt}</span></div></div>
      <div class="cmp-ratio">${r.r.toFixed(1)}×</div>
    </button>`;
  }).join('') : `<div class="cmp-empty">해당 조건의 사례가 없습니다.</div>`;

  main.innerHTML = `
    <div class="cmp-head anim-0">
      <div class="cmp-title">사례 비교 — 최적화 개선 배수</div>
      <div class="cmp-desc">각 사례의 대표 지표(지연·메모리·크기·속도)를 기준으로 원본 대비 몇 배 개선됐는지 한 화면에서 비교합니다. 막대는 로그 스케일이며, 행을 클릭하면 상세 페이지로 이동합니다.</div>
      <div class="cmp-controls">${chips}<div class="cmp-sep"></div>${sorts}</div>
      <div class="cmp-legend">${GROUPS.filter(g=>compareRows().some(r=>r.m.group===g.key)).map(g=>
        `<div class="cmp-lg"><i class="cmp-g-${g.key}"></i>${g.label}</div>`).join('')}</div>
    </div>
    <div class="cmp-table anim-1">
      <div class="cmp-hdr"><span>사례 · 디바이스</span><span>개선 배수 (로그 스케일)</span><span>대표 지표 전 → 후</span><span>배수</span></div>
      ${body}
    </div>
    <div class="cmp-note anim-2">
      ※ 대표 지표는 사례별 첫 번째 성능 지표입니다 (성능 유지 지표는 제외). 여러 디바이스가 있는 경우 가장 개선폭이 큰 조합을 사용했습니다.<br>
      ※ 원본 실행 자체가 불가능했던 사례(Yolo-Fastest, YOLOv8 NPU)와 최적화 후 값만 있는 온디바이스 LLM/VLM 상세 벤치마크는 배수 산출 대상에서 제외했습니다.
    </div>`;

  requestAnimationFrame(()=>setTimeout(()=>{
    rows.forEach((_,k)=>{ const el=document.getElementById(`cf-${k}`); if(el) el.style.width=el.dataset.w+'%'; });
  },60));
}
function setCmp(kind, val) { if (kind==='filter') cmpFilter = val; else cmpSort = val; renderCompare(); }

// ═══════════════════════════════════════════════════════════

      <div class="ov-kpi-row">
        <div class="ov-kpi"><div class="ov-kpi-val">최대 99%</div><div class="ov-kpi-lbl">추론 지연 단축 (IR 보행자 탐지)</div></div>
        <div class="ov-kpi"><div class="ov-kpi-val">최대 76.5%</div><div class="ov-kpi-lbl">메모리 절감 (Solar Open2 250B)</div></div>
        <div class="ov-kpi"><div class="ov-kpi-val">8 → 2장</div><div class="ov-kpi-lbl">서버 GPU 사용량 (H100)</div></div>
        <div class="ov-kpi"><div class="ov-kpi-val">${models.length}건</div><div class="ov-kpi-lbl">검증된 최적화 사례</div></div>
        <div class="ov-kpi"><div class="ov-kpi-val">${models.filter(m=>m.accuracyNote||m.accuracy||m.accuracyMulti).length}건</div><div class="ov-kpi-lbl">정확도 영향 수치 확보</div></div>
      </div>
    </div>
    ${sections}
    <div class="bench-footnote anim-3" style="margin-top:8px;padding-bottom:12px">
      ※ 산업용 Vision 사례의 최적화 전 수치는 CPU·FP32 기준, 최적화 후는 DSP·INT8 기준입니다.<br>
      ※ 모든 수치는 노타 자체 실측 벤치마크 결과이며, 각 사례 페이지의 「측정 · 검증 조건」에 런타임·SDK·정밀도·배치 조건을 함께 기재했습니다.<br>
      ※ Confidential &amp; Proprietary · © 2026 Nota Inc.
    </div>`;
}

applyFilter();
routeFromHash(true);
